# ============================================================================
# Company Brain — Docker Compose (Team 20)
# PostgreSQL 17 with pgvector
# ============================================================================
version: '3.9'

services:
  # PostgreSQL 17 + pgvector extension
  db:
    image: pgvector/pgvector:pg17
    container_name: company-brain-pg17
    environment:
      POSTGRES_DB: hackathon_team_20
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hackathon_team_20"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
