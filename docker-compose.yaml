# ============================================================================
# Company Brain — Docker Compose for local development
# ============================================================================
version: '3.9'

services:
  # PostgreSQL 17 with pgvector
  db:
    image: pgvector/pgvector:pg17
    container_name: company-brain-db
    environment:
      POSTGRES_DB: company_brain
      POSTGRES_USER: company_brain
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company_brain"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Node.js API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: company-brain-api
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://company_brain:local_dev_password@db:5432/company_brain
      - PGHOST=db
      - PGPORT=5432
      - PGDATABASE=company_brain
      - PGUSER=company_brain
      - PGPASSWORD=local_dev_password
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-https://api.openai.com/v1}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./mock_sources:/app/mock_sources

  # React Frontend (dev server)
  frontend:
    image: node:20-alpine
    container_name: company-brain-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3001

volumes:
  pgdata:
